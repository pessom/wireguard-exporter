# Friendly peer names defined in Prometheus: one series
# wireguard_peer_name{public_key, name} = 1 per peer. Edit and reload
# Prometheus (SIGHUP or POST /-/reload); no regex escaping is needed.
#
# Preferred: let the exporter export wireguard_peer_name itself
# (--wireguard.peer-names-file, docs/configuration.md). Use this file only
# when you cannot give the exporter a names file. Both can be combined.
#
# Optional extra labels (e.g. owner, site) are carried along by the join in
# wireguard.rules.yml only if you add them to its group_left(...) list.
groups:
  - name: wireguard-peer-names
    interval: 1m
    rules:
      - record: wireguard_peer_name
        expr: vector(1)
        labels:
          public_key: "xTIBA5rboUvnH4htodjb6e697QjLERt1NAB4mZqp8Dg="
          name: alice-laptop
      - record: wireguard_peer_name
        expr: vector(1)
        labels:
          public_key: "HIgo9xNzJMWLKASShiTqIybxZ0U3wGLiUeJ1PKf8ykw="
          name: office-gateway
