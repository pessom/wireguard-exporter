[package]
name = "wireguard-exporter"
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
description = "Prometheus exporter for WireGuard (kernel netlink)"
license = "MIT"
repository = "https://github.com/pessom/wireguard-exporter"
publish = false

[[bin]]
name = "wireguard_exporter"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
clap = { version = "4.6", features = ["derive", "env"] }
prometheus-client = "0.25"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = { version = "2.1.1", default-features = false, features = ["deserialize"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[target.'cfg(target_os = "linux")'.dependencies]
defguard_wireguard_rs = { version = "0.12", default-features = false }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
