# kubectl apply -k contrib/kubernetes
# Prometheus Operator: also apply servicemonitor.yaml.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: wireguard-exporter
labels:
  - pairs:
      app.kubernetes.io/name: wireguard-exporter
    includeSelectors: true
resources:
  - namespace.yaml
  - daemonset.yaml
  - service.yaml
images:
  - name: ghcr.io/pessom/wireguard-exporter
    newTag: "0.3.1" # keep in sync with Cargo.toml (checked by the Release workflow)
