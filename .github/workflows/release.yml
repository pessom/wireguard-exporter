name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  IMAGE: ghcr.io/${{ github.repository }}
  CHART_REPO: oci://ghcr.io/${{ github.repository_owner }}/charts

jobs:
  verify:
    runs-on: ubuntu-26.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: version
        name: Check tag matches Cargo.toml and manifests
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          test "$tag" = "$ver" || { echo "tag v$tag != Cargo.toml $ver"; exit 1; }
          grep -q "newTag: \"$ver\"" contrib/kubernetes/kustomization.yaml \
            || { echo "contrib/kubernetes/kustomization.yaml newTag != $ver"; exit 1; }
          grep -q "^appVersion: \"$ver\"" charts/wireguard-exporter/Chart.yaml \
            || { echo "charts/wireguard-exporter/Chart.yaml appVersion != $ver"; exit 1; }
          # Versions in examples: image tags, `--version X`, `VERSION=X`.
          if grep -rnE 'wireguard-exporter:[0-9]|--version [0-9]|VERSION=[0-9]' contrib docs README.md \
              | grep -vE "(:|--version |VERSION=)$ver\b"; then
            echo "versions in contrib/, docs/ or README.md != $ver"; exit 1
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
      - run: rustup toolchain install
      - run: cargo test --locked

  build:
    needs: verify
    uses: ./.github/workflows/build.yml

  github-release:
    needs: [verify, build]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wireguard_exporter-linux-*
          path: artifacts
      - name: Package
        run: |
          for arch in amd64 arm64; do
            name="wireguard_exporter-${VERSION}.linux-${arch}"
            mkdir -p "dist/$name"
            install -m 0755 "artifacts/wireguard_exporter-linux-$arch/wireguard_exporter" "dist/$name/"
            cp LICENSE README.md contrib/wireguard_exporter.service "dist/$name/"
            tar -C dist -czf "dist/$name.tar.gz" "$name"
          done
          (cd dist && sha256sum *.tar.gz > sha256sums.txt)
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          files: |
            dist/*.tar.gz
            dist/sha256sums.txt
          generate_release_notes: true

  image:
    needs: [verify, build]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wireguard_exporter-linux-*
          path: artifacts
      - name: Arrange binaries in dist/<arch>/
        run: |
          for a in amd64 arm64; do
            install -D -m 0755 "artifacts/wireguard_exporter-linux-$a/wireguard_exporter" "dist/$a/wireguard_exporter"
          done
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: latest=true
          labels: |
            org.opencontainers.image.title=wireguard-exporter
            org.opencontainers.image.description=Prometheus exporter for WireGuard (kernel netlink)
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}

  chart:
    needs: [verify, image]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Package and push chart
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | helm registry login ghcr.io -u "$GH_ACTOR" --password-stdin
          helm package charts/wireguard-exporter --version "$VERSION" --app-version "$VERSION" -d dist
          helm push "dist/wireguard-exporter-$VERSION.tgz" "$CHART_REPO"
