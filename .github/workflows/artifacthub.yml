name: Artifact Hub

# Publishes artifacthub-repo.yml next to the Helm chart in GHCR under the
# `artifacthub.io` tag, so Artifact Hub can verify repository ownership.

on:
  push:
    branches: [main]
    paths: [artifacthub-repo.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3
      - name: Push repository metadata
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ github.token }}
          REF: ghcr.io/${{ github.repository_owner }}/charts/wireguard-exporter:artifacthub.io
        run: |
          echo "$GH_TOKEN" | oras login ghcr.io -u "$GH_ACTOR" --password-stdin
          oras push "$REF" \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml
