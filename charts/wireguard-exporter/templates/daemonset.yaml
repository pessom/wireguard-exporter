apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "wireguard-exporter.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wireguard-exporter.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "wireguard-exporter.selectorLabels" . | nindent 6 }}
  updateStrategy:
    {{- toYaml .Values.updateStrategy | nindent 4 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "wireguard-exporter.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      hostNetwork: {{ .Values.hostNetwork }}
      {{- if .Values.hostNetwork }}
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: wireguard-exporter
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --web.listen-address={{ .Values.listenAddress | default (printf "0.0.0.0:%v" .Values.port) }}
            - --web.telemetry-path={{ .Values.telemetryPath }}
            {{- with .Values.interfaces }}
            - --wireguard.interfaces={{ join "," . }}
            {{- end }}
            {{- if include "wireguard-exporter.peerNamesConfigMap" . }}
            - --wireguard.peer-names-file=/etc/wireguard_exporter/{{ .Values.peerNamesConfigMapKey }}
            {{- end }}
            {{- if not .Values.collector.peerEndpoint }}
            - --no-collector.peer-endpoint
            {{- end }}
            {{- if not .Values.collector.peerAllowedIps }}
            - --no-collector.peer-allowed-ips
            {{- end }}
            {{- with .Values.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            - name: RUST_LOG
              value: {{ .Values.logLevel | quote }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: metrics
              containerPort: {{ .Values.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: metrics
          readinessProbe:
            httpGet:
              path: /
              port: metrics
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if include "wireguard-exporter.peerNamesConfigMap" . }}
          volumeMounts:
            - name: peer-names
              mountPath: /etc/wireguard_exporter
              readOnly: true
          {{- end }}
      {{- if include "wireguard-exporter.peerNamesConfigMap" . }}
      volumes:
        - name: peer-names
          configMap:
            name: {{ include "wireguard-exporter.peerNamesConfigMap" . }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
