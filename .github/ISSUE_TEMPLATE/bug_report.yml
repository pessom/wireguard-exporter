name: Bug report
description: Something does not work as documented
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please check [Troubleshooting](https://github.com/pessom/wireguard-exporter/blob/main/docs/troubleshooting.md) first.
        **Never post private or preshared keys.** Public keys and endpoints may be redacted.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Exporter version
      description: Output of `wireguard_exporter --version` or the image tag.
      placeholder: "0.3.0"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How is the exporter run?
      options:
        - Binary / systemd
        - Docker
        - nerdctl / containerd
        - Podman
        - Kubernetes (Helm chart)
        - Kubernetes (kustomize / own manifests)
        - Other
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Distribution, kernel (`uname -r`), architecture; for Kubernetes also the version and CNI.
      placeholder: "Ubuntu 26.04, 6.17.0-5-generic, arm64"
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Command line / configuration
      description: Flags, environment variables, Helm values or manifests (without secrets).
      render: shell
  - type: textarea
    id: metrics
    attributes:
      label: Relevant /metrics output
      description: For example `curl -s localhost:9586/metrics | grep -E 'scrape_success|wg0'`.
      render: text
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Exporter logs, ideally with `RUST_LOG=debug`.
      render: text
