name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly: new RustSec advisories and runner image changes.
    - cron: "0 6 * * 1"
  workflow_call:
    inputs:
      ref:
        description: Git ref to check out
        type: string
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  deny:
    # Advisories, licenses, duplicate crates and sources (deny.toml).
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  e2e:
    # Real kernel WireGuard: tunnel + handshake + exporter with CAP_NET_ADMIN.
    runs-on: ubuntu-26.04
    needs: check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install wireguard-tools
        run: sudo apt-get update && sudo apt-get install -y wireguard-tools
      - run: cargo build --release --locked
      - run: scripts/e2e.sh target/release/wireguard_exporter
