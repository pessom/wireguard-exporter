image:
  repository: ghcr.io/pessom/wireguard-exporter
  # Defaults to the chart appVersion.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Share the node network namespace to monitor the node's WireGuard
# interfaces. Requires a namespace with the "privileged" Pod Security Standard.
hostNetwork: true

# Container port; with hostNetwork it is opened on every node.
port: 9586
# Defaults to 0.0.0.0:<port>.
listenAddress: ""
telemetryPath: /metrics
# Fixed list of interfaces; empty means autodiscovery.
interfaces: []
logLevel: info

# Friendly peer names, exported as wireguard_peer_name. Rendered into a
# ConfigMap; changes are picked up without a restart (the kubelet syncs
# ConfigMap volumes within about a minute).
#   peerNames:
#     "xTIBA5rboUvnH4htodjb6e697QjLERt1NAB4mZqp8Dg=": alice-laptop
#     "HIgo9xNzJMWLKASShiTqIybxZ0U3wGLiUeJ1PKf8ykw=":
#       name: office-gateway
#       site: fra
peerNames: {}
# Or use an existing ConfigMap with the key below instead of peerNames.
existingPeerNamesConfigMap: ""
peerNamesConfigMapKey: peers.yml

collector:
  # Export peer endpoints (public IPs) in wireguard_peer_info.
  peerEndpoint: true
  # Export allowed IPs (wireguard_peer_info label, wireguard_peer_allowed_ip).
  peerAllowedIps: true
extraArgs: []
extraEnv: []

podAnnotations: {}
podLabels: {}

# UID 0 with only NET_ADMIN: non-root would need file capabilities, which
# allowPrivilegeEscalation: false disables.
podSecurityContext:
  seccompProfile:
    type: RuntimeDefault
securityContext:
  runAsUser: 0
  runAsNonRoot: false
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]
    add: [NET_ADMIN]

resources:
  requests:
    cpu: 10m
    memory: 16Mi
  limits:
    memory: 64Mi

nodeSelector: {}
# Run on every node, including control plane and tainted ones.
tolerations:
  - operator: Exists
affinity: {}
priorityClassName: ""

updateStrategy:
  type: RollingUpdate

service:
  # Headless: one endpoint per node.
  enabled: true
  annotations:
    prometheus.io/scrape: "true"

serviceMonitor:
  # Requires the Prometheus Operator CRDs.
  enabled: false
  labels: {}
  interval: 30s
  scrapeTimeout: ""
  # Use the node name as the `instance` label.
  instanceFromNodeName: true
  relabelings: []
  metricRelabelings: []
